[project]
name = "vida-marinha"
version = "0.1.0"
description = "Riqueza de espécies marinhas na costa brasileira: o que é biologia e o que é esforço de coleta (dados do OBIS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vida_marinha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
